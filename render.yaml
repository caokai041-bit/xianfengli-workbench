services:
  - type: web
    name: xianfengli-workbench
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run db:migrate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: xianfengli-db
          property: connectionString

databases:
  - name: xianfengli-db
    plan: free
    region: singapore
    databaseName: xianfengli
    user: xianfengli
